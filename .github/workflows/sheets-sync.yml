name: Private daily Sheets import
on:
  schedule:
    - cron: '0 21 * * *' # 06:00 JST; GitHub may delay scheduled starts.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Validate only; do not update the portal database'
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: private-sheets-import
  cancel-in-progress: false
jobs:
  sync:
    # Schedule runs on the default branch only. Enable after a successful manual dry run.
    if: github.event_name == 'workflow_dispatch' || vars.SHEETS_SYNC_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production-data-sync
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - name: Validate or import private source data
        env:
          SHEETS_SERVICE_ACCOUNT_JSON: ${{ secrets.SHEETS_SERVICE_ACCOUNT_JSON }}
          SHEETS_SYNC_CONFIG: ${{ secrets.SHEETS_SYNC_CONFIG }}
          SUPABASE_SYNC_URL: ${{ secrets.SUPABASE_SYNC_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        shell: bash
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            node scripts/sync-google-sheets.mjs --dry-run
          else
            node scripts/sync-google-sheets.mjs
          fi
